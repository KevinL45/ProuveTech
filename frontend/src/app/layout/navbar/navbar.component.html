<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    <!-- Logo -->
    <div class="navbar-brand">
      <a [routerLink]="['/']" class="brand-link">
        <img src="assets/logo/logo2.png" alt="ProuveTech" class="brand-logo" />
        <span class="brand-text">ProuveTech</span>
      </a>
    </div>

    <!-- Menu Burger -->
    <button class="menu-toggle" 
            (click)="toggleMenu()" 
            [class.active]="menuOpen"
            aria-label="Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Navigation -->
    <div class="nav-container" [class.open]="menuOpen">
      <!-- Liens principaux -->
      <ul class="nav-left">
        <li>
          <a class="nav-link" 
             [routerLink]="['/acteurs-it']"
             routerLinkActive="active"
             *ngIf="isAdmin()">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>Talents</span>
          </a>
        </li>
        <li>
          <a class="nav-link" 
             [routerLink]="['/projets']"
             routerLinkActive="active"
             *ngIf="isAdmin()">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            <span>Projets</span>
          </a>
        </li>
        <li *ngIf="isAuthenticated()">
          <a class="nav-link" 
             [routerLink]="['/profil']"
             routerLinkActive="active">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profil</span>
          </a>
        </li>
      </ul>

      <!-- Actions utilisateur -->
      <ul class="nav-right">
        <!-- Non connecté -->
        <li *ngIf="isAdmin()">
          <a class="btn-outline" [routerLink]="['/inscription']">
            <span>Ajouter un bêta-testeur</span>
          </a>
        </li>
        <li *ngIf="!isAuthenticated()">
          <a class="btn-primary" [routerLink]="['/connexion']">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>Connexion</span>
          </a>
        </li>
        
        <!-- Connecté -->
        <li *ngIf="isAuthenticated()">
          <a class="btn-danger" (click)="logout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Déconnexion</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Overlay mobile -->
<div class="navbar-overlay" [class.active]="menuOpen" (click)="closeMenu()"></div>
