<title>Acteurs IT</title>

<div class="actor-page">
  <!-- Section Header -->
  <div class="section-header">
    <span class="section-badge">Trouvez votre prochain talent</span>
    <h1 class="page-title">Découvrez les <span class="gradient-text">meilleurs développeurs</span></h1>
    <p class="page-subtitle">Explorez les profils des développeurs qui pensent produit et démontrent leur vraie valeur</p>
  </div>

  <!-- Search Bar -->
  <div class="search-section">
    <div class="search-container">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input 
        [(ngModel)]="searchTitle" 
        (input)="filterUsers()" 
        type="text" 
        placeholder="Rechercher par titre, compétence..." 
        class="search-input"
      />
    </div>
  </div>

  <div class="developers-list">
    <div class="developer-card" *ngFor="let user of paginatedUsers" (click)="detailsUser(user)">
      <img [src]="url+user.linkPhoto || 'assets/default-avatar.png'" alt="photo de profil" />
      <div class="dev-info">
        <h2>{{user.firstname}} {{user.lastname}}</h2>
        <p class="status">{{user.status?.name}}</p>
        <p class="title" [title]="user.title"> {{ truncate(user, 25) }}</p>
      </div>
    </div>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">Précédent</button>
    <span class="pages">{{currentPage}} / {{totalPages()}}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages()">Suivant</button>
  </div>

</div>
