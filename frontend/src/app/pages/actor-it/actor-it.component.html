<title>Acteurs IT</title>

<div class="actor-page">
      <h1>Découvrez les talents </h1>
  <div class="header">
    <div class="filters">
      <input [(ngModel)]="searchTitle" (input)="filterUsers()" type="text" placeholder="Rechercher par titre" />
      <select [(ngModel)]="selectedStatusId" (change)="filterUsers()">
        <option value="">Tous les statuts</option>
        <option *ngFor="let status of listStatus" [value]="status.id">{{status.name}}</option>
      </select>
    </div>
  </div>

  <div class="developers-list">
    <div class="developer-card" *ngFor="let user of paginatedUsers" (click)="detailsUser(user)">
      <img [src]="url+user.linkPhoto || 'assets/default-avatar.png'" alt="photo de profil" />
      <div class="dev-info">
        <h2>{{user.firstname}} {{user.lastname}}</h2>
        <p class="status">{{user.status?.name}}</p>
        <p class="title" [title]="user.title"> {{ truncate(user, 25) }}</p>
      </div>
    </div>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">Précédent</button>
    <span class="pages">{{currentPage}} / {{totalPages()}}</span>
    <button (click)="nextPage()" [disabled]="currentPage === totalPages()">Suivant</button>
  </div>

</div>
