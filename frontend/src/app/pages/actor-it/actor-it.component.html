<section class="developers-page">
  <div class="header">
    <h1>👨‍💻 Acteurs de la tech</h1>
    <div class="filters">
      <input type="text" placeholder="Rechercher par techno..." />
      <select>
        <option value="">Tous les statuts</option>
        <option *ngFor="let status of listStatus" [value]="status.id">{{status.name}}</option>
      </select>
    </div>
  </div>

  <div class="developers-list">
    <div class="developer-card" *ngFor="let user of listUsers">
      <img [src]="'assets/default-avatar.png'" alt="photo de profil" />
      <div class="dev-info">
        <h2>{{user.firstname}} {{user.lastname}}</h2>
        <p class="title">{{user.title}}</p>
      </div>
    </div>
  </div>
</section>
