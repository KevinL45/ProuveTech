<title>Profil</title>
<!-- Profile Header Section -->
<section class="profile-hero">
  <!-- Background Pattern -->
  <div class="hero-background">
    <div class="gradient-overlay"></div>
    <div class="pattern-dots"></div>
  </div>

  <!-- Profile Content -->
  <div class="profile-container">
    <!-- Main Profile Card -->
    <div class="profile-card">
      <!-- Profile Header -->
      <div class="profile-header">
        <!-- Avatar Section -->
        <div class="avatar-wrapper">
          <img 
            class="avatar-image" 
            [src]="url + user?.linkPhoto || 'assets/default-avatar.png'"
            [alt]="user?.firstname + ' ' + user?.lastname"
          />
          <!-- <span class="status-indicator" [class.online]="true"></span> -->
          <!-- <button class="avatar-edit" *ngIf="!id">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </button> -->
        </div>

        <!-- User Info -->
        <div class="user-info">
          <h1 class="user-name">
            {{ user?.firstname }} {{ user?.lastname }}
          </h1>
          
          <p class="user-title">{{ user?.title || "Développeur Full Stack" }}</p>
          
          <div class="user-meta">
            <span class="status-badge" [class]="user?.status?.name?.toLowerCase()">
              <span class="status-dot"></span>
              {{ user?.status?.name || "Pas de statut" }}
            </span>
            
            <!-- <span class="location">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              Paris, France
            </span>
            
            <span class="experience">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              5+ ans d'expérience
            </span> -->
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="profile-actions">
          <!-- Own Profile Actions -->
          <ng-container *ngIf="!id">
            <button class="btn-action primary" (click)="editProfile()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              <span>Modifier le profil</span>
            </button>
            
            <button class="btn-action secondary" (click)="MyProjectList()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              <span>Mes démos</span>
            </button>
          </ng-container>

          <!-- Visitor Actions -->
          <ng-container *ngIf="id">
            <button class="btn-action primary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c1.1 0 2 .9 2 2H2c0-1.1.9-2 2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22 6 12 13 2 6"/>
              </svg>
              <span>Contacter</span>
            </button>
          </ng-container>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-value">...</span>
          <span class="stat-label">Videos</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">...</span>
          <span class="stat-label">Playlist</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Profile Content Section -->
<section class="profile-content">
  <div class="content-container">
    <div class="content-grid">
      
      <!-- Left Column -->
      <div class="content-left">
        
        <!-- About Section -->
        <div class="content-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              À propos
            </h2>
          </div>
          
          <div class="card-body">
            <p class="bio-text" [class.expanded]="showFullDescription">
              {{ user?.description || "Pas de description" }}
            </p>
            
            <button 
              *ngIf="isLongDescription()" 
              class="btn-expand"
              (click)="toggleDescription()">
              <span>{{ showFullDescription ? 'Voir moins' : 'Voir plus' }}</span>
              <svg 
                width="16" 
                height="16" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="2"
                [class.rotate]="showFullDescription">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="content-right">
        
        <!-- Projects Preview -->
        <div class="content-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              Vidéos récents
            </h2>
            <button class="btn-see-all" (click)="ProjectList(user?.id)">
              Voir tout
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
          
          <div class="card-body"  >
            <div class="projects-grid">

          <button class="btn-add-project" *ngIf="!id" (click)="addProject()">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
              </svg>
              <span>Ajouter un projet</span>
            </button>

              <div class="project-preview" *ngFor="let project of projects">
                <div class="project-thumbnail" (click)="detailsProject(project)">
                  <img [src]="url+project.link_thumbnail">
                  <div class="play-overlay">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                  </div>
                </div>
                <h4 class="project-title">{{ project.name}}</h4>
                <!-- Les outils -->
                <!-- <div *ngFor="let tool of project?.tools">
                <p class="project-tech">{{tool.name}}</p>
                </div> -->
              </div>
            </div>

  
          </div>
        </div>
