<title>Admin</title>

<div *ngIf="message" [ngClass]="{'success': success, 'error': !success}" class="message">
  {{ message }}
</div><div class="admin-page">
  <h1>Gestion des outils</h1>

  <div class="card">
        <h2>Ajouter un outil</h2>
    <form class="form" [formGroup]="toolForm" (ngSubmit)="submit()">

        <div class="form-group">
            <label>Nom de l'outil</label>
            <input type="text" formControlName="name" required/>
        </div>

        <div class="form-group">
            <label>Logo</label>
            <input type="file" (change)="onLogoSelected($event)" accept="image/*" />
            <img *ngIf="previewLogo" [src]="previewLogo" class="preview-logo" />
        </div>
        <button type="submit" [disabled]="toolForm.invalid">+</button>
    </form>

        <h2>🛠️ Outils</h2>
        <ul class="list">
            <li *ngFor="let tool of listTools">
                <img [src]="url+tool.logo" alt="logo" />
                <span>{{ tool.name }}</span>
                    <div class="actions">
                        <button >Suppprimer</button>
                        <button >Modifier</button>
                    </div>
            </li>
        </ul>
  </div>
</div>
