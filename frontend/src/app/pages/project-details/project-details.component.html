<div class="container">
  <!-- LEFT SIDE -->
  <div class="left">
    <div class="video-container" *ngIf="project?.link_video">
      <video controls [src]="url+project?.link_video"></video>
    </div>

 
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div>
      <div class="title">{{ project?.name }}</div>
      <p class="description" [innerHTML]="project?.description">
       {{ project?.description }}
      </p>

      <div *ngIf="project?.sourcecode" class="section">
              <div class="section-details">Lien du code</div>
      </div>

      <div class="section">
          <div class="section-details" *ngFor="let tool of project?.tools">{{ tool.name }}</div>
      </div>

    <div class="profile">
      <img [src]="url+project?.user?.linkPhoto || 'assets/default-avatar.png'" alt="photo">
      <div class="profile-info">
        <strong>{{ project?.user?.firstname  }} {{ project?.user?.lastname  }} - {{ project?.user?.title}}</strong><br>
        {{ project?.user?.status?.name }}
      </div>
    </div>
  </div>
</div>
