<section class="projects-page">
  <div class="header">
    <h1>📽️ Projets</h1>
    <div class="filters">
      <input type="text" placeholder="Rechercher un projet..."  />

      <input
        type="text"
        placeholder="Filtrer par tags (ex: Angular, Node...)"
      />
    </div>
  </div>

  <div class="projects-list">
    <div
      class="project-card"  *ngFor="let project of listProjects" (click)="detailsProject(project)">
      <div class="video-wrapper">
        <video controls [src]="url+project.link_video"></video>
      </div>
      <div class="project-content">
        <h2>{{project.name}}</h2>
        <div class="user-info">
          <img
            [src]="'assets/default-avatar.png'"
            alt="profil"
          />
          <div>
            <p class="name">{{project.fullname}}</p>
            <p class="title">{{project.titleActor}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
