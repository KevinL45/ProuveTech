<section class="projects-page">
      <h1>📽️ Les vidéos postées par les développeurs</h1>
  <div class="header">
    <div class="filters">
      <input [(ngModel)]="searchTitle" (input)="filterProjects()" type="text" placeholder="Rechercher un projet..."  />
      <!-- <ng-select
        [items]="listTools"
        bindLabel="name"
        bindValue="id"
        [multiple]="true"
        [searchable]="true"
        [(ngModel)]="selectedToolIds"
        (change)="filterProjects()">
      </ng-select> -->
    </div>
  </div>

  <div class="projects-list">
    <div
      class="project-card"  *ngFor="let project of filteredProjects" (click)="detailsProject(project)">
      <div class="video-wrapper">
        <video controls [src]="url+project.link_video"></video>
      </div>
      <div class="project-content">
        <h2>{{project.name}}</h2>
        <div class="user-info">
          <img
            [src]="'assets/default-avatar.png'"
            alt="profil"
          />
          <div>
            <p class="name">{{project.fullname}}</p>
            <p class="title">{{project.titleActor}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
