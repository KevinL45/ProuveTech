  <div *ngIf="message" [ngClass]="{'success': success, 'error': !success}" class="message">
  {{ message }}
  </div>
<section class="page">
  <form class="form" [formGroup]="userForm" (ngSubmit)="register()">
    <h2>Créer un compte</h2>

    <div class="form-group">
      <label for="firstname">Prénom</label>
      <input type="text" id="firstname" formControlName="firstname" required />
    </div>

    <div class="form-group">
      <label for="lastname">Nom</label>
      <input type="text" id="lastname"  formControlName="lastname" required />
    </div>

    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email"  formControlName="mail" required />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password"  formControlName="password" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Retapez le mot de passe</label>
      <input type="password" id="confirmPassword"  formControlName="confirmPassword" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="status">Statut</label>
      <select id="status" name="status" formControlName="statusId" required>
        <option *ngFor="let status of listStatus" [value]="status.id">{{status.name}}</option>
      </select>
    </div>

    <button type="submit" [disabled]="userForm.invalid">S'inscrire</button>

    <p class="login-link">
      Déjà un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </form>
</section>
