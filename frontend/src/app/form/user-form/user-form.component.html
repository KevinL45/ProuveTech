  <div *ngIf="message" [ngClass]="{'success': success, 'error': !success}" class="message">
  {{ message }}
  </div>
<section class="page">
<form class="form" *ngIf="mode === 'register'" [formGroup]="userForm" (ngSubmit)="register()">
    <h2>Créer un compte</h2>

    <div class="form-group">
      <label for="firstname">Prénom</label>
      <input type="text" id="firstname" formControlName="firstname" required />
    </div>

    <div class="form-group">
      <label for="lastname">Nom</label>
      <input type="text" id="lastname"  formControlName="lastname" required />
    </div>

    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email"  formControlName="mail" required />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password"  formControlName="password" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Retapez le mot de passe</label>
      <input type="password" id="confirmPassword"  formControlName="confirmPassword" required minlength="6" />
    </div>

    <div class="form-group">
      <label for="status">Statut</label>
      <select id="status" name="status" formControlName="statusId" required>
        <option *ngFor="let status of listStatus" [value]="status.id">{{status.name}}</option>
      </select>
    </div>

    <button type="submit" [disabled]="userForm.invalid">S'inscrire</button>

    <p class="login-link">
      Déjà un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </form>
  
  <form class="form" *ngIf="mode === 'login'" [formGroup]="loginForm" (ngSubmit)="auth()">
        <h2>Authentification</h2>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email"  formControlName="mail" required />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password"  formControlName="password" required minlength="6" />
      </div>
      <p class="login-link">
        <a routerLink="/connexion">Mot de passe oublié ?</a>
      </p>
      <button type="submit" [disabled]="loginForm.invalid">Se connecter</button>
      <p class="login-link">
        Vous n'avez pas de compte ? <a routerLink="/connexion">S'inscrire</a>
      </p>
  </form>

  <form class="form" *ngIf="mode === 'update'" [formGroup]="updateForm" (ngSubmit)="updateUser()">
    <h2>Modifier votre profil</h2>

    <div class="form-group">
      <img *ngIf="previewPicture" [src]="previewPicture" class="preview-picture" />
      <label for="photo">Photo du profil</label>
      <input type="file" id="photo" (change)="onPictureSelected($event)" accept="image/*" placeholder="Votre photo profil"/>
    </div>

    <div class="form-group">
      <label for="firstname">Prénom</label>
      <input type="text" id="firstname" formControlName="firstname" placeholder="Votre prénom" required />
    </div>

    <div class="form-group">
      <label for="lastname">Nom</label>
      <input type="text" id="lastname"  formControlName="lastname" placeholder="Votre nom" required />
    </div>

    <div class="form-group">
      <label for="status">Statut</label>
      <select id="status" name="status" formControlName="statusId" required>
        <option *ngFor="let status of listStatus" [value]="status.id" >{{status.name}}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="title">Titre</label>
      <input type="text" id="title" formControlName="title" required placeholder="Votre titre (Ex : Développeur Angular)"/>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea type="text" id="description" formControlName="description" required placeholder="Description de votre profil"></textarea>
    </div>

    <button type="submit" [disabled]="updateForm.invalid">Modifier</button>
  </form>
</section>
