

<div class="page">
  <form class="form" [formGroup]="projectForm" (ngSubmit)="submit()" enctype="multipart/form-data">

    <div *ngIf="message" [ngClass]="{'success': success, 'error': !success}" class="message">
      {{ message }}
    </div>
    
    <h2 *ngIf="mode === 'create-project'" >Créer un projet</h2>
    <h2 *ngIf="mode === 'update-project'" >Modifier le projet</h2>

    <div class="form-group">
      <label for="name">Nom du projet</label>
      <input type="text" id="name" formControlName="name" required />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" required></textarea>
    </div>

    <div class="form-group">
      <label for="sourcecode">Lien du code source</label>
      <input type="text" id="sourcecode" formControlName="sourcecode" />
    </div>

    <div class="form-group">
        <label for="tools">Outils utilisés</label>
        <ng-select 
          [items]="listTools"
          bindLabel="name"
          bindValue="id"
          [multiple]="true"
          [searchable]="true"
          formControlName="tools">
        </ng-select>
    </div>

    <div class="form-group">
      <label for="video">Miniature du projet</label>
      <input type="file" id="thumbnail" (change)="onThumbnailChange($event)" accept="image/*" />
    </div>
    <div *ngIf="thumbnailUrl" class="form-group">
      <label>Miniature actuelle :</label><br>
      <img [src]="thumbnailUrl" alt="Miniature du projet" style="max-width: 200px; border: 1px solid #ccc;">
    </div>

    <div class="form-group">
      <label for="video">Vidéo du projet</label>
      <input type="file" id="video" (change)="onVideoChange($event)" accept="video/*" />
    </div>
    <div *ngIf="videoUrl" class="form-group">
      <label>Vidéo actuelle :</label><br>
      <video [src]="videoUrl" controls style="max-width: 100%;"></video>
    </div>

    <button type="submit" [disabled]="projectForm.invalid">
  {{ mode === 'create-project' ? 'Ajouter le projet' : 'Mettre à jour' }}
    </button>
  </form>
</div>
