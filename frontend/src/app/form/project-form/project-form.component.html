<div class="page">
  <form class="form" [formGroup]="projectForm" (ngSubmit)="submit()" enctype="multipart/form-data">

    <div *ngIf="message" [ngClass]="{'success': success, 'error': !success}" class="message">
      {{ message }}
    </div>

    <h2 *ngIf="mode === 'create-project'">Ajouter un projet</h2>
    <title *ngIf="mode === 'create-project'">Ajouter un projet</title>

    <h2 *ngIf="mode === 'update-project'">Modifier le projet</h2>
    <title *ngIf="mode === 'update-project'">Modifier le projet</title>


    <div class="form-group">
      <label for="name">*Nom -
        {{ projectForm.get('name')?.value?.length || 0 }} / 50
      </label>
      <input type="text" id="name" formControlName="name" required />
      <div class="error" *ngIf="projectForm.get('name')?.hasError('maxlength')">
        Maximum 50 caractères autorisés.
      </div>
    </div>

    <div class="form-group">
      <label for="description">*Description -
        {{ projectForm.get('description')?.value?.length || 0 }} / 1000
      </label>
      <textarea id="description" formControlName="description" required></textarea>
      <div class="error" *ngIf="projectForm.get('description')?.hasError('maxlength')">
        Maximum 1000 caractères autorisés.
      </div>
    </div>

    <div class="form-group">
      <label for="sourcecode">Lien du code source</label>
      <input type="text" id="sourcecode" formControlName="sourcecode" />
      <div class="char-count">
        {{ projectForm.get('sourcecode')?.value?.length || 0 }} / 255
      </div>
      <div class="error" *ngIf="projectForm.get('sourcecode')?.hasError('maxlength')">
        Maximum 255 caractères autorisés.
      </div>
    </div>

    <div class="form-group">
      <label for="tools">*Outils utilisés -
          {{ projectForm.get('tools')?.value?.length || 0 }} / 3
      </label>
      <ng-select [items]="listTools" bindLabel="name" bindValue="id" [multiple]="true" [searchable]="true"
        [maxSelectedItems]="3" formControlName="tools">
      </ng-select>
      <div class="error" *ngIf="projectForm.get('tools')?.hasError('maxTools')">
        Maximum 3 outils autorisés.
      </div>
    </div>

    <div class="form-group">
      <label for="video">*Miniature</label>
      <input class="uploads" type="file" id="thumbnail" (change)="onThumbnailChange($event)" accept="image/*" />
    </div>
    <div *ngIf="thumbnailUrl" class="form-group">
      <label>Miniature actuelle :</label><br>
      <img [src]="thumbnailUrl" alt="Miniature">
    </div>

    <button type="submit" [disabled]="projectForm.invalid">
      {{ mode === 'create-project' ? 'Ajouter le projet' : 'Mettre à jour' }}
    </button>
  </form>
</div>
